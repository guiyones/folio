name: folio

services:
  database:
    image: postgres:18-alpine
    container_name: folio-db
    ports:
      - "127.0.0.1:${FOLIO_DB_PORT:-5452}:5432" # dev password; reachable only from this machine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: folio
    volumes:
      - folio-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d folio"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  folio-db-data:
